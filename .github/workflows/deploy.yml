name: Deploy

# Builds the static site and publishes it to GitHub Pages. Only `main`
# deploys; feature work lands on `dev` first and reaches `main` by PR.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but a
# deployment already in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Public values for the "show email" control (see worker/README.md).
      # Unset, the site shows "email coming soon".
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          PUBLIC_EMAIL_WORKER_URL: ${{ vars.PUBLIC_EMAIL_WORKER_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
